name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, lint, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run verify

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  docker:
    name: docker image
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      # Образ только собирается и проверяется на запуск: публикацией занимается деплой.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ruscable-front:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test the image
        run: |
          docker run -d --name rc-ci -p 3000:3000 ruscable-front:ci
          timeout 60 sh -c 'until curl -sf http://127.0.0.1:3000/ >/dev/null; do sleep 2; done'
          curl -s http://127.0.0.1:3000/ | grep -q '<h1' || exit 1
          docker rm -f rc-ci
          retention-days: 7
