name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Копит conventional-коммиты в release-PR с готовым CHANGELOG.
      # Мерж этого PR создаёт тег и GitHub Release.
      # Настройки версионирования - в release-please-config.json:
      # проект намеренно остаётся в 0.x, пока портал не заработает.
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
