name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Копит conventional-коммиты в release-PR с готовым CHANGELOG.
      # Мерж этого PR создаёт тег и GitHub Release.
      - uses: googleapis/release-please-action@v5
        with:
          release-type: node
