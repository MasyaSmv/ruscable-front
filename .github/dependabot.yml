version: 2
updates:
  # Именно bun, а не npm: с экосистемой npm dependabot правит package.json,
  # но не обновляет bun.lock, и CI падает на `bun install --frozen-lockfile`.
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Мелочь собирается в один PR, мажорные версии приходят отдельно и требуют внимания.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # TypeScript 7 пока не поддерживается typescript-eslint:
      # "Error: typescript-eslint does not support TS 7.0".
      # Обновиться физически нельзя, а dependabot иначе будет каждую неделю
      # пересоздавать заведомо красный PR. Снять это правило, когда
      # typescript-eslint объявит поддержку TS 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # ESLint 10 несовместим с eslint-plugin-react, который тянет eslint-config-next:
      # "TypeError: Error while loading rule 'react/display-name'".
      # Снять, когда eslint-config-next заявит поддержку ESLint 10.
      - dependency-name: eslint
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
