version: 2
updates:
  # Именно bun, а не npm: с экосистемой npm dependabot правит package.json,
  # но не обновляет bun.lock, и CI падает на `bun install --frozen-lockfile`.
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Мелочь собирается в один PR, мажорные версии приходят отдельно и требуют внимания.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
