# Проверка production-образа локально: то же, что уедет на сервер.
# Для повседневной разработки используется `bun run dev` без Docker -
# hot-reload через смонтированный том в WSL работает заметно медленнее.
#
# Запуск:  docker compose up --build
# Открыть: http://localhost:3000

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ruscable-front:local
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
# Когда появится бэкенд, сюда добавятся сервисы api и db,
# и web будет ходить в api по имени сервиса внутри сети compose.
